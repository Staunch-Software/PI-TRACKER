<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="url(#brandGrad)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f4c81" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Anchor circle top -->
  <circle cx="12" cy="5" r="3" filter="url(#glow)"/>

  <!-- Anchor vertical stem -->
  <line x1="12" y1="22" x2="12" y2="8" filter="url(#glow)"/>

  <!-- Anchor arms curved bottom -->
  <path d="M5 12H2a10 10 0 0 0 20 0h-3" filter="url(#glow)"/>

  <!-- PI letters on the stem -->
  <text x="11.2" y="15" font-size="7" font-weight="900" fill="url(#brandGrad)" stroke="none" text-anchor="end" filter="url(#glow)">P</text>
  <text x="12.8" y="15" font-size="7" font-weight="900" fill="url(#brandGrad)" stroke="none" text-anchor="start" filter="url(#glow)">I</text>
</svg>
