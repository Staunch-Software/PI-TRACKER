# Nginx site config: serves the built frontend and reverse-proxies /api to the backend, over
# HTTPS on pitracker.ozellar.com (using this VM's existing *.ozellar.com wildcard certificate —
# no certbot issuance needed, unlike a brand-new standalone domain).
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/pi_tracker
#   sudo ln -s /etc/nginx/sites-available/pi_tracker /etc/nginx/sites-enabled/pi_tracker
#   sudo nginx -t && sudo systemctl reload nginx
#
# Only reachable via pitracker.ozellar.com from here on — no default_server / bare-IP fallback
# (matches how every other project on this VM behaves; the bare public IP falls back to
# whichever site was already the VM's implicit default before this one existed).

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name pitracker.ozellar.com;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name pitracker.ozellar.com;

    ssl_certificate /etc/ssl/ozellar/fullchain.pem;
    ssl_certificate_key /etc/ssl/ozellar/wildcard_ozellar_com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Built frontend files are copied here (see DEPLOYMENT.md's "deploy the build" step) —
    # not served straight out of the repo checkout, so multiple projects on this VM can each
    # have their own /var/www/<project> without colliding.
    root /var/www/pi-tracker;
    index index.html;

    # Backend API — same-origin, so the frontend's relative /api/... fetch calls just work
    # and no CORS_ALLOWED_ORIGIN juggling is needed.
    # No trailing slash on proxy_pass, and no /api/ repeated in the target (unlike some other
    # projects' configs): this backend's own routes are registered including the /api/ prefix
    # (see backend/app/main.py's health route), so the prefix must be passed through as-is —
    # omitting a path on proxy_pass entirely forwards the original request URI unchanged.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router (BrowserRouter) client-side routing — any path that isn't a real static
    # file falls back to index.html so refreshing on e.g. /tracker doesn't 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
