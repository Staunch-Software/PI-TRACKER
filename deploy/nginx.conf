# Nginx site config: serves the built frontend and reverse-proxies /api to the backend.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/pi-tracker
#   sudo ln -s /etc/nginx/sites-available/pi-tracker /etc/nginx/sites-enabled/pi-tracker
#   sudo rm -f /etc/nginx/sites-enabled/default   # avoid the stock "Welcome to nginx" default clashing
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace server_name below once you have a domain pointed at this VM (see DEPLOYMENT.md
# for adding HTTPS via certbot at that point) — until then "_" (any Host header) is fine
# for IP-only access.

server {
    listen 80;
    server_name _;

    # Built frontend files are copied here (see DEPLOYMENT.md's "deploy the build" step) —
    # not served straight out of the repo checkout, so multiple projects on this VM can each
    # have their own /var/www/<project> without colliding.
    root /var/www/pi-tracker;
    index index.html;

    # Backend API — same-origin, so the frontend's relative /api/... fetch calls just work
    # and no CORS_ALLOWED_ORIGIN juggling is needed.
    # No trailing slash on proxy_pass (deliberate, unlike some other projects' configs): a
    # trailing slash here would strip the /api/ prefix before forwarding, but this backend's
    # routes are registered including /api/ (see backend/app/main.py's health route), so the
    # prefix must be passed through as-is.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router (BrowserRouter) client-side routing — any path that isn't a real static
    # file falls back to index.html so refreshing on e.g. /tracker doesn't 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
